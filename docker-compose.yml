# Runs on home-ai next to the household-ai stack; joins its network to reach calendar-api.
services:
  kitchen-dashboard:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: household/kitchen-dashboard:${APP_VERSION:-dev}
    container_name: kitchen-dashboard
    ports: ["8081:8000"]
    environment:
      CALENDAR_API: http://calendar-api:8000
      DASHBOARD_DB: /data/dashboard.db
      OPENWEBUI_URL: http://open-webui:8080
      OPENWEBUI_KEY_FILE: /run/kitchen-secrets/openwebui_key
      HOUSE_TOKEN_FILE: /run/kitchen-secrets/house_token
      WHISPER_URL: http://host.docker.internal:8178
      PHOTOS_DIR: /photos
    volumes:
      - ${HOME}/household-ai/data/dashboard:/data
      - ${HOME}/household-ai/secrets/kitchen:/run/kitchen-secrets:ro   # only the kitchen's two secrets
      - ${HOME}/household-ai/data/photos/kitchen:/photos:ro       # filled hourly by ops/photo-sync.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [household]
    restart: unless-stopped

networks:
  household:
    external: true
    name: household-ai_default
